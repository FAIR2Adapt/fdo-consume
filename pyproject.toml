[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fdo-consume"
dynamic = ["version"]
description = "Consumer-side interpretation and binding of FAIR Digital Objects for application requirements."
requires-python = ">=3.10"
classifiers = ["Programming Language :: Python :: 3", "Typing :: Typed"]
license = {text = "MIT"}
dependencies = ["PyYAML>=6", "PyLD>=2.0.4"]

[project.scripts]
fdo-consume = "fdo_consume.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fdo_consume = ["py.typed", "record.schema.json", "binding.schema.json", "semantics/data/*.json", "semantics/data/*.yaml", "profiles/maps/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "fdo_consume._version.__version__"}
