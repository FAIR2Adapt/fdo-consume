    source: "rocrate_output_mapper.py validate_dashboard_dataset: 'metadata.title is missing' stops the dataset"
    reason: "Required to head the page and the metadata panel."
  - term: description
    level: should
    source: "metadataPanel.js renderMetadata: the description paragraph"
    reason: "Used in the metadata panel."
  - term: licence
    level: should
    source: "metadataPanel.js renderMetadata: row 'License'"
    reason: "Used in the metadata panel to state the terms of reuse."
  - term: date
    level: should
    source: "metadataPanel.js renderMetadata: row 'Published'"
    reason: "Used in the metadata panel."
  - term: author
    level: should
    source: "metadataPanel.js renderMetadata: section 'Authors'"
    reason: "Used in the metadata panel."
