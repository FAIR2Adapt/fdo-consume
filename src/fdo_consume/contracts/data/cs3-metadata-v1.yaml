contract_id: cs3-metadata-v1
version: 1
consumer:
  service: "CS3 urban pluvial flood dashboard (repository cs3-dashboard)"
  capability: "head the page and fill the metadata panel: title, description, licence, date, authors"
source:
  repository: "urban-pfr-dashboard"
  path: "frontend/js/ui/metadataPanel.js; backend/services/rocrate_output_mapper.py"
  symbol: "renderMetadata; validate_dashboard_dataset"
  reviewed: "2026-10-09"
needs:
