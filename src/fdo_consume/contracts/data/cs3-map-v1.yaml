contract_id: cs3-map-v1
version: 2
consumer:
  service: "CS3 urban pluvial flood dashboard (repository cs3-dashboard)"
  capability: "draw the public risk map layer and the social vulnerability background from the object's map products"
source:
  repository: "urban-pfr-dashboard"
  path: "backend/services/binding_to_dataset.py; backend/services/rocrate_output_mapper.py"
  symbol: "_layers; _validate_dataproduct"
  reviewed: "2026-10-09"
accepts:
  - application/vnd.flatgeobuf
  - application/flatgeobuf
  - application/vnd.pmtiles
  - application/geo+json
needs:
  - term: Dataset
    level: must
    source: "config/dashboard.yaml: every layer is one Dataset (map product) found by its PID"
    reason: "Required to identify the map products available to the map renderer."
  - term: Variable
    level: must
    source: "rocrate_output_mapper.py _validate_dataproduct: riskMap.variableMapping needs the two risk variables"
    reason: "Required to bind the variables the map renderer colours by."
  - term: Property
    level: should
    source: "rocrate_output_mapper.py _validate_dataproduct: riskMap.classification; the class breaks travel as an additionalProperty named classBreaks"
    reason: "Required for a deterministic classification and legend."
