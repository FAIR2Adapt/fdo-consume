contract_id: listing-collection-v1
version: 1
consumer:
  service: "knowledge-listing dashboard (repository knowledge-listing): a list of the FDOs of one collection and a page per resource"
  capability: "head the list page with the collection's title and list its members"
source:
  repository: "knowledge-listing"
  path: "frontend/app.js"
  symbol: "drawList"
  reviewed: "2026-10-10"
needs:
  - term: title
    level: must
    source: "schema.org name of the collection; frontend/app.js drawList heading"
    reason: "Required to head the list page."
  - term: members
    level: must
    source: "schema.org hasPart, one IRI per member FDO"
    reason: "Required to list, search and count the members."
  - term: description
    level: should
    source: "frontend/app.js drawList: the description under the title"
    reason: "Used to describe the collection on the list page."
