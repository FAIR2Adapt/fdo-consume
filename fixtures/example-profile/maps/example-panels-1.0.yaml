# synthetic profile map, kept outside the package: passed with profile_maps=
id: example-panels-1.0
status: example
source: "synthetic example profile for tests and documentation; terms under https://example.org/terms/"
selects:
  - https://example.org/profile/panels/1.0
identity: identifier
fields:
  title: {iri: "https://schema.org/name", level: must}
  description: {iri: "https://schema.org/description", level: should}
  licence: {iri: "https://schema.org/license", level: should}
  date: {iri: "https://schema.org/datePublished", level: should}
  identifier: {iri: "https://schema.org/identifier", level: may}
  profile: {iri: "http://purl.org/dc/terms/conformsTo", level: should}
  author: {iri: ["https://schema.org/author", "https://schema.org/name"], level: may, many: true}
entities:
  Layer:
    type: "https://example.org/terms/Layer"
    level: may
    fields:
      name: {iri: "https://schema.org/name", level: should}
  LayerFile:
    via: "https://example.org/terms/file"
    type: "https://example.org/terms/LayerFile"
    role: resource
    level: may
    fields:
      url: {iri: "https://example.org/terms/url", level: should}
      media_type: {iri: "https://example.org/terms/mediaType", level: should}
  Measure:
    type: "https://example.org/terms/Measure"
    provides: [Variable]
    level: may
    fields:
      name: {iri: "https://schema.org/name", level: should}
      code: {iri: "https://example.org/terms/code", level: should}
  Finding:
    type: "https://example.org/terms/Finding"
    provides: [Assertion]
    level: may
    fields:
      text: {iri: "https://example.org/terms/text", level: should}
