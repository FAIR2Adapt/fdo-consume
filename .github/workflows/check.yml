name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install .

      - name: Public tests
        if: ${{ hashFiles('tests/**') != '' }}
        run: python -m unittest discover -s tests

      - name: Smoke check
        run: |
          python -c "import fdo_consume"
          fdo-consume --help

      - name: Command line
        run: >
          fdo-consume consume
          https://example.org/object/full
          --contract map-panel-v1
          --recorded-dir fixtures/example-profile
          --profile-maps fixtures/example-profile/maps
          --contracts fixtures/example-profile/contracts
          > /dev/null